name: Update topic backlog

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. This runs every day at 05:17 UTC.
    - cron: "17 5 * * *"

concurrency:
  group: update-topic-backlog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-backlog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read topic issues from upstream repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo OpenChain-Project/OpenChain-Business-Operations \
            --state all \
            --label topic \
            --limit 1000 \
            --json number,title,url,labels,state,createdAt,updatedAt \
            > topic-issues.json

      - name: Update topics.md
        env:
          SOURCE_REPOSITORY: OpenChain-Project/OpenChain-Business-Operations
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("topics.md")
          data_file = Path("topic-issues.json")

          start_marker = "<!-- TOPIC-BACKLOG:START -->"
          end_marker = "<!-- TOPIC-BACKLOG:END -->"

          status_order = {
              "Idea": 0,
              "Discussion": 1,
              "Workstream": 2,
              "Project Proposal": 3,
              "Archived": 4,
          }

          def markdown_escape(value):
              return str(value).replace("|", "\\|").replace("\n", " ").strip()

          def get_status(labels):
              # Highest lifecycle stage wins if an issue has conflicting labels.
              if "archived" in labels:
                  return "Archived"
              if "proposal" in labels:
                  return "Project Proposal"
              if "workstream" in labels:
                  return "Workstream"
              if "discussion" in labels:
                  return "Discussion"
              return "Idea"

          issues = json.loads(data_file.read_text(encoding="utf-8"))
          backlog = []

          for issue in issues:
              labels = {
                  label["name"].strip().lower()
                  for label in issue.get("labels", [])
              }

              if "topic" not in labels or "rejected" in labels:
                  continue

              backlog.append({
                  "status": get_status(labels),
                  "number": issue["number"],
                  "title": issue["title"],
                  "url": issue["url"],
                  "state": issue["state"].title(),
              })

          backlog.sort(
              key=lambda item: (
                  status_order[item["status"]],
                  item["number"],
              )
          )

          source_repo = os.environ["SOURCE_REPOSITORY"]
          lines = [
              start_marker,
              "<!-- This section is generated by .github/workflows/update-topics.yml. -->",
              "",
              "| Status | Topic | Issue | GitHub state |",
              "|---|---|---:|---|",
          ]

          if backlog:
              for item in backlog:
                  title = markdown_escape(item["title"])
                  lines.append(
                      f'| {item["status"]} | [{title}]({item["url"]}) '
                      f'| [#{item["number"]}]({item["url"]}) | {item["state"]} |'
                  )
          else:
              issues_url = f"https://github.com/{source_repo}/issues?q=is%3Aissue+label%3Atopic+-label%3Arejected"
              lines.append(
                  f"| Idea | [No qualifying topic issues found]({issues_url}) | - | - |"
              )

          lines.extend(["", end_marker])
          generated = "\n".join(lines)

          if target.exists():
              current = target.read_text(encoding="utf-8")
          else:
              current = "# Topics\n"

          if start_marker in current and end_marker in current:
              before, remainder = current.split(start_marker, 1)
              _, after = remainder.split(end_marker, 1)
              updated = before.rstrip() + "\n\n" + generated + after
          else:
              updated = current.rstrip() + "\n\n## Topic backlog\n\n" + generated + "\n"

          target.write_text(updated, encoding="utf-8")
          PY

      - name: Commit updated backlog
        run: |
          if git diff --quiet -- topics.md; then
            echo "topics.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.md
          git commit -m "docs: update topic backlog"
          git push origin HEAD:main
